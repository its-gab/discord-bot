services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=YOUR_DISCORD_TOKEN
      - WELCOME_CHANNEL_ID=CHANNEL_ID
      - NEW_MEMBER_ROLE_ID=ROLE_ID
      - TV_IP=YOUR_SAMSUNG_TV_IP
      - MC_FOLDER=PATH_TO_MC_FOLDER
    privileged: true
